[project]
name = "Smart-Bank"
version = "0.1.0"
description = "Smart Banking Assistant — Agentic RAG with LangGraph"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",          # file uploads
    # ── Database
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    # ── LangGraph + LangChain ─────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    # ── OpenAI ────────────────────────────────────────────────────────────────
    "openai>=1.30.0",
    # ── Cohere ────────────────────────────────────────────────────────────────
    "cohere>=5.5.0",
    # ── Docling ───────────────────────────────────────────────────────────────
    "docling>=2.5.0",
    # ── Config + env ──────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    # ── Streamlit ─────────────────────────────────────────────────────────────
    "streamlit>=1.35.0",
    # ── Utilities ─────────────────────────────────────────────────────────────
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "langchain-community>=0.2.0",
    "sqlalchemy>=2.0.0",
    "guardrails-ai>=0.10.2",
]
